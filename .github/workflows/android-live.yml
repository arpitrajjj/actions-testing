name: Android Emulator — Live (macOS Intel runner)

# Boots a real Android Emulator on the macOS x86_64 (Intel) runner where
# Hypervisor.framework (HVF) IS available — so it boots fast. Streams the screen
# as raw binary frames over WebSocket (LOW latency); taps/swipes go straight to
# `adb shell input` — no buttons.
#
# Public URL: printed in log + summary + pushed to repo as ANDROID_LIVE_URL.txt.
# Stays alive ~2 hours.

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/android-live.yml"
      - "android-live/**"

permissions:
  contents: write

concurrency:
  group: android-live
  cancel-in-progress: false

jobs:
  live:
    runs-on: macos-15-intel
    timeout-minutes: 180

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install system image (x86_64 for Intel runner)
        run: |
          echo "arch: $(uname -m)"
          echo "hv_support: $(sysctl -n kern.hv_support 2>/dev/null || echo n/a)"
          echo "SDK root: $ANDROID_SDK_ROOT"
          export CMDTOOLS="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin"
          "$CMDTOOLS/sdkmanager" --version
          yes | "$CMDTOOLS/sdkmanager" --licenses >/dev/null 2>&1 || true
          "$CMDTOOLS/sdkmanager" --install 'system-images;android-35;google_apis;x86_64' --channel=0
          echo "--- installed images ---"
          ls "$ANDROID_SDK_ROOT/system-images/android-35/google_apis/" 2>/dev/null || true

      - name: Boot Android emulator + stream + tunnel (~2 hours)
        run: |
          chmod +x android-live/run.sh
          bash android-live/run.sh
